<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Polls{% endblock %}</title>
    <style>
        body {
            font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            max-width: 720px;
            margin: 40px auto;
            padding: 0 20px;
            color: #1a1a1a;
            background: #fafafa;
            line-height: 1.5;
        }
        a { color: #2454ff; }
        h1 { font-size: 1.6rem; }
        nav.top-nav { margin-bottom: 20px; }
        ul.question-list { list-style: none; padding: 0; }
        ul.question-list li {
            padding: 12px 16px;
            margin-bottom: 8px;
            background: #fff;
            border: 1px solid #e2e2e2;
            border-radius: 8px;
        }
        ul.question-list a { text-decoration: none; font-weight: 600; }
        fieldset {
            border: 1px solid #e2e2e2;
            border-radius: 8px;
            padding: 16px 20px;
            background: #fff;
        }
        legend { font-weight: 700; padding: 0 6px; }
        .choice-row { margin: 8px 0; }
        .error {
            color: #b3261e;
            background: #fdecea;
            border: 1px solid #f5c2c0;
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 12px;
        }
        button, input[type="submit"] {
            background: #2454ff;
            color: #fff;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 14px;
        }
        button:hover, input[type="submit"]:hover { background: #173ecb; }
        .geo-box {
            margin-top: 18px;
            padding: 12px 14px;
            background: #f2f5ff;
            border: 1px solid #d7e0ff;
            border-radius: 8px;
            font-size: 0.92rem;
        }
        .geo-status { margin-top: 6px; color: #555; font-size: 0.85rem; min-height: 1.1em; }
        .results-list { list-style: none; padding: 0; }
        .results-list li { padding: 10px 0; border-bottom: 1px solid #eee; }
        .bar-bg { background: #e9edff; border-radius: 4px; height: 10px; margin-top: 4px; overflow: hidden; }
        .bar-fill { background: #2454ff; height: 100%; }
        #map { height: 380px; border-radius: 8px; margin-top: 20px; border: 1px solid #e2e2e2; }
        .actions { margin-top: 20px; }
        .muted { color: #666; font-size: 0.9rem; }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <nav class="top-nav"><a href="{% url 'polls:index' %}">&larr; All polls</a></nav>
    {% block content %}{% endblock %}
</body>
</html>
